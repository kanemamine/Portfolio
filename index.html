<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Business Insider — simulateur d'investissement mobile : clic, entreprises, bourse, crypto, immobilier et luxe.">
<title>Business Insider — Investor Tycoon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<div id="splash" class="splash">
  <div class="splash-logo">BUSINESS<span>INSIDER</span></div>
  <div class="splash-sub">Investor Tycoon · Web</div>
  <div class="splash-bar"><i></i></div>
</div>

<header class="hud">
  <div class="hud-row">
    <div class="hud-cash">
      <span class="hud-label">Solde</span>
      <strong id="hud-cash">$0</strong>
    </div>
    <div class="right">
      <span class="hud-label">Patrimoine</span>
      <strong id="hud-net" class="hud-net-v">$0</strong>
    </div>
  </div>
  <div class="hud-row hud-row-sub">
    <span class="chip"><em class="up" id="hud-hr">$0</em>&nbsp;/h</span>
    <span class="chip">🎫&nbsp;<em id="hud-tickets">0</em></span>
    <span class="chip gold" id="hud-rank">#100</span>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="nav">
  <button class="nav-btn" data-tab="business" type="button"><span class="nav-ico">🏢</span><span>Business</span></button>
  <button class="nav-btn" data-tab="investments" type="button"><span class="nav-ico">📈</span><span>Investir</span></button>
  <button class="nav-btn is-active" data-tab="earnings" type="button"><span class="nav-ico">💰</span><span>Gains</span></button>
  <button class="nav-btn" data-tab="luxe" type="button"><span class="nav-ico">💎</span><span>Luxe</span></button>
  <button class="nav-btn" data-tab="account" type="button"><span class="nav-ico">👤</span><span>Compte</span></button>
</nav>

<div class="toasts" id="toasts"></div>
<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-close="1"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
</div>

<script>
/* Filet de sécurité au démarrage.

   Si un ancien service worker sert du code périmé, les modules plantent et le
   jeu reste bloqué sur l'écran de chargement. Passé ce délai sans démarrage,
   on purge les caches, on désinscrit les service workers et on recharge — une
   seule fois, pour ne jamais boucler. */
(function () {
  var KEY = 'bi.selfheal';
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (window.__BOOTED) { try { sessionStorage.removeItem(KEY); } catch (e) {} return; }
      if (sessionStorage.getItem(KEY)) {
        var el = document.querySelector('.splash-sub');
        if (el) el.textContent = 'Échec du démarrage — videz le cache du navigateur';
        return;
      }
      try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
      var done = function () { location.reload(); };
      var jobs = [];
      if (window.caches) jobs.push(caches.keys().then(function (k) {
        return Promise.all(k.map(function (n) { return caches.delete(n); }));
      }));
      if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
      Promise.all(jobs).then(done, done);
    }, 6000);
  });
})();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
